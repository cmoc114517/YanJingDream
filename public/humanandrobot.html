  { q: '月食发生时，地球在太阳和什么之间？（两个字）', a: '月亮' },
  { q: '最大的行星是哪一个？（两个字）', a: '木星' },
  { q: '离太阳最近的行星是？（两个字）', a: '水星' },
  { q: '光年是测量什么的单位？（两个字）', a: '距离' }
];

// ========== 打乱并随机抽取 10 道 ==========
function shuffle(arr) {
  var a = arr.slice(); // 浅拷贝
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

var selectedQuestions = shuffle(allQuestions).slice(0, 10);
var currentCorrect = 0;  // 当前答对数量

// ========== 常量 ==========
var REGISTER_CODE = 'yanjingpeoplehihihi';

function $(id) { return document.getElementById(id); }

// ========== Toast ==========
var toastTimer;
function showToast(msg, type) {
  var t = $('toast');
  t.textContent = msg;
  t.className = 'toast ' + type + ' show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { t.className = 'toast'; }, 3000);
}

// ========== 渲染验证题 ==========
function renderCaptcha() {
  var container = $('captchaList');
  var html = '';
  for (var i = 0; i < selectedQuestions.length; i++) {
    html += '<div class="captcha-item" id="captcha-' + i + '">' +
      '<div class="captcha-q"><span class="num">' + (i + 1) + '</span>' + selectedQuestions[i].q + '</div>' +
      '<input class="captcha-input" id="captcha-input-' + i + '" placeholder="" oninput="checkCaptcha(' + i + ')" autocomplete="off">' +
      '<div class="captcha-status" id="captcha-status-' + i + '"></div>' +
      '</div>';
  }
  container.innerHTML = html;
  updateProgress();
}

// ========== 检查单道题 ==========
function checkCaptcha(index) {
  var input = $('captcha-input-' + index);
  var status = $('captcha-status-' + index);
  var item = $('captcha-' + index);
  var userAnswer = input.value.trim();

  if (!userAnswer) {
    status.textContent = '';
    status.className = 'captcha-status';
    item.className = 'captcha-item';
    recalcAll();
    return;
  }

  var correctAnswer = selectedQuestions[index].a;
  if (userAnswer === correctAnswer) {
    status.textContent = '正确 ✓';
    status.className = 'captcha-status ok';
    item.className = 'captcha-item pass';
  } else {
    status.textContent = '回答错误，请重试';
    status.className = 'captcha-status fail';
    item.className = 'captcha-item wrong';
  }

  recalcAll();
}

// ========== 汇总所有题目 ==========
function recalcAll() {
  currentCorrect = 0;
  for (var i = 0; i < selectedQuestions.length; i++) {
    var input = $('captcha-input-' + i);
    if (input && input.value.trim() === selectedQuestions[i].a) {
      currentCorrect++;
    }
  }
  updateProgress();
}

function updateProgress() {
  var pct = Math.round((currentCorrect / selectedQuestions.length) * 100);
  $('progressFill').style.width = pct + '%';
  $('progressText').textContent = currentCorrect + '/' + selectedQuestions.length + ' 通过';

  // 全部答对才启用提交按钮
  var formOk = validateFormFields();
  $('submitBtn').disabled = !(currentCorrect === selectedQuestions.length && formOk);
}

// ========== 表单字段验证 ==========
function validateFormFields() {
  var username = ($('reg-username').value || '').trim();
  var email = ($('reg-email').value || '').trim();
  var password = ($('reg-password').value || '');
  var code = ($('reg-code').value || '').trim();

  var ok = true;
  if (username.length < 3 || username.length > 20) ok = false;
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) ok = false;
  if (password.length < 6) ok = false;
  if (!code) ok = false;
  return ok;
}

// ========== 表单实时监听 ==========
['username', 'email', 'password', 'code'].forEach(function(field) {
  var el = $('reg-' + field);
  if (el) {
    el.addEventListener('input', function() { updateProgress(); });
  }
});

// ========== 提交注册 ==========
$('submitBtn').addEventListener('click', function() {
  if ($('submitBtn').disabled) return;

  var username = $('reg-username').value.trim();
  var email = $('reg-email').value.trim();
  var password = $('reg-password').value;
  var registrationCode = $('reg-code').value.trim();

  // 前端验证
  var ok = true;
  $('err-username').textContent = '';
  $('err-email').textContent = '';
  $('err-password').textContent = '';
  $('err-code').textContent = '';

  if (username.length < 3) { $('err-username').textContent = '用户名至少 3 个字符'; ok = false; }
  if (username.length > 20) { $('err-username').textContent = '用户名最多 20 个字符'; ok = false; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { $('err-email').textContent = '请输入有效的邮箱地址'; ok = false; }
  if (password.length < 6) { $('err-password').textContent = '密码至少 6 位'; ok = false; }
  if (!registrationCode) { $('err-code').textContent = '请输入注册码'; ok = false; }
  if (registrationCode !== REGISTER_CODE) { $('err-code').textContent = '注册码错误'; ok = false; }
  if (!ok) return;

  var btn = $('submitBtn');
  btn.classList.add('loading');
  btn.disabled = true;

  fetch('/api/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      username: username,
      email: email,
      password: password,
      registerCode: registrationCode
    })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    btn.classList.remove('loading');
    btn.disabled = false;
    if (data.success) {
      showToast('注册成功！正在跳转...', 'success');
      // 保存 token 到 localStorage
      try {
        localStorage.setItem('yanjing_token', data.token);
        localStorage.setItem('yanjing_user', JSON.stringify(data.user));
      } catch(e) {}
      setTimeout(function() { window.location.href = 'index.html'; }, 1500);
    } else {
      showToast(data.message || '注册失败，请重试', 'error');
    }
  })
  .catch(function(err) {
    btn.classList.remove('loading');
    btn.disabled = false;
    showToast('网络错误，请检查连接后重试', 'error');
  });
});

// ========== 初始化 ==========
renderCaptcha();
</script>
