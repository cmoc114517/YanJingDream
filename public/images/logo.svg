<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" width="300" height="260">
  
  <!-- 左边斜杠 /  从右上到左下 -->
  <line x1="100" y1="15" x2="30" y2="240" stroke="#1a73e8" stroke-width="12" stroke-linecap="round"/>
  
  <!-- 右边眼镜: 左圆（加大） -->
  <circle cx="185" cy="85" r="36" fill="none" stroke="#1a73e8" stroke-width="5"/>
  
  <!-- 右边眼镜: 连接横线 -->
  <line x1="221" y1="85" x2="249" y2="85" stroke="#1a73e8" stroke-width="5" stroke-linecap="round"/>
  
  <!-- 右边眼镜: 右圆（加大） -->
  <circle cx="285" cy="85" r="36" fill="none" stroke="#1a73e8" stroke-width="5"/>
  
  <!-- dream 文字，在眼镜正下方 -->
  <text x="235" y="195" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#1a73e8" letter-spacing="4">dream</text>
  
</svg>
